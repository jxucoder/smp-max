name = "SmpF5"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["SmpF5"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

[[lean_lib]]
name = "SmpF5"

[[lean_exe]]
name = "export_cnf"
root = "ExportCnf"
