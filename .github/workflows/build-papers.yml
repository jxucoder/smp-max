name: build-papers
on:
  workflow_dispatch:
  push:
    paths:
      - 'papers/f5/**'
      - 'papers/f6/**'
      - 'papers/notes/f6-schedule-reduction.tex'
      - '.github/workflows/build-papers.yml'
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the three papers (TeX Live, latexmk)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            papers/f5/f5-max-stable-matchings.tex
            papers/f6/f6-max-stable-matchings.tex
            papers/notes/f6-schedule-reduction.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: false
      - uses: actions/upload-artifact@v4
        with:
          name: papers
          path: |
            papers/f5/f5-max-stable-matchings.pdf
            papers/f6/f6-max-stable-matchings.pdf
            papers/notes/f6-schedule-reduction.pdf
          if-no-files-found: error
