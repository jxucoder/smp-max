name: lean-verify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build-and-check-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Get Mathlib cache
        working-directory: f5/lean/SmpF5
        run: lake exe cache get
      - name: Build (kernel-checks every theorem)
        working-directory: f5/lean/SmpF5
        run: lake build
      - name: No sorries
        working-directory: f5/lean/SmpF5
        run: "! grep -rn sorry SmpF5/"
      - name: Axiom check
        working-directory: f5/lean/SmpF5
        run: |
          printf 'import SmpF5.Lower\n#print axioms f5_eq_16_of_unsat\n' > /tmp/ax.lean
          lake env lean /tmp/ax.lean | tee /tmp/ax.out
          grep -q "depends on axioms: \[propext, Classical.choice, Quot.sound\]" /tmp/ax.out
      - name: Axiom check (f6 reduction layer)
        working-directory: f5/lean/SmpF5
        run: |
          printf 'import SmpF5\n#print axioms bridge\n#print axioms chain_complete\n#print axioms traj_mem_iff\n#print axioms wtraj_nodup\n#print axioms total_moves_le_30\n' > /tmp/ax6.lean
          lake env lean /tmp/ax6.lean | tee /tmp/ax6.out
          test "$(grep -c 'depends on axioms: \[propext, Classical.choice, Quot.sound\]' /tmp/ax6.out)" = "5"
      - name: Witness standalone (kernel-only, propext)
        working-directory: f5/lean
        run: |
          lake env lean Witness.lean 2>/dev/null || true
          cd SmpF5 && lake env lean ../Witness.lean | grep -q "\[propext\]"
