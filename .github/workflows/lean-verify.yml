name: lean-verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build-and-check-axioms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Get Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build, axioms, and standalone checks
        run: bash tools/check_lean.sh
